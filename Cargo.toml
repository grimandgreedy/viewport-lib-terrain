[package]
name = "viewport-lib-terrain"
version = "1.3.0"
edition = "2024"
description = "Heightmap and splatmap terrain rendering for viewport-lib"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib-terrain"
homepage = "https://github.com/grimandgreedy/viewport-lib-terrain"
documentation = "https://docs.rs/viewport-lib-terrain"
keywords = ["3d", "terrain", "heightmap", "viewport", "viewport-lib"]
categories = ["graphics", "rendering", "visualization"]
rust-version = "1.85"
publish = true
exclude = ["examples/", "assets/"]

[features]
default = ["gpu"]
# The plugin: its pipelines, shaders, mesh baking, picking and the detail
# scatter. Off, the crate holds only the terrain data types, built against
# viewport-lib-types alone, with neither viewport-lib nor wgpu in the tree.
gpu = ["dep:viewport-lib", "dep:viewport-lib-plugins", "dep:wgpu"]

[dependencies]
viewport-lib-types = { path = "../../viewport-lib/crates/viewport-lib-types", version = "0.2" }
viewport-lib = { path = "../../viewport-lib/crates/viewport-lib", version = "0.22", optional = true }
# Sprites moved out of the renderer into viewport-lib-plugins; the detail
# scatter emits them.
viewport-lib-plugins = { path = "../../viewport-lib/crates/viewport-lib-plugins", version = "0.1", optional = true }
wgpu = { version = "27.0", optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }

[dev-dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.33"
naga = { version = "27", features = ["wgsl-in"] }
# Decodes the example textures and tree models under examples/assets.
viewport-lib-io = { version = "0.8", default-features = false, features = ["jpeg", "png", "gltf"] }

[[example]]
name = "eframe-terrain"
path = "examples/eframe_terrain.rs"

[[example]]
name = "eframe-terrain-detail"
path = "examples/eframe_terrain_detail.rs"

[[example]]
name = "eframe-terrain-lod"
path = "examples/eframe_terrain_lod.rs"

[[example]]
name = "eframe-plugin-jobs"
path = "examples/eframe_plugin_jobs.rs"

[[example]]
name = "eframe-terrain-stress"
path = "examples/eframe_terrain_stress.rs"
